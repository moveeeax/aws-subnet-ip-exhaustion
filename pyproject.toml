[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-subnet-ip-exhaustion"
version = "0.1.0"
description = "Forecast when each VPC subnet runs out of free IP addresses, counting the ENIs that really consume them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "vpc", "subnet", "capacity-planning", "sre", "eks", "audit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = ["boto3>=1.28"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
aws-subnet-ip-exhaustion = "aws_subnet_ip_exhaustion.cli:run"

[project.urls]
Homepage = "https://github.com/moveeeax/aws-subnet-ip-exhaustion"
Issues = "https://github.com/moveeeax/aws-subnet-ip-exhaustion/issues"

[tool.setuptools]
packages = ["aws_subnet_ip_exhaustion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
